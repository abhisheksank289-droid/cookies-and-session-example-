<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A cookie-backed Node.js session example." />
    <title>Northstar Workspace</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="brand-rail" aria-label="Northstar introduction">
        <div class="brand-mark">N</div>
        <p class="eyebrow">Northstar / 06</p>
        <h1>Make room for the work that matters.</h1>
        <p class="rail-copy">A quiet command center for teams turning good intentions into finished things.</p>
        <div class="rail-note">
          <span class="signal-dot"></span>
          <span>Private workspace</span>
        </div>
      </section>

      <section class="workspace" id="app" aria-live="polite">
        <div class="loading-state">Checking your session...</div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
